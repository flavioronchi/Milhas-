name: Buscar resgates

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando do app (JSON). Vazio = rodada normal."
        required: false
        default: ""
  # Liga a busca automática quando o primeiro coletor real estiver pronto:
  # schedule:
  #   - cron: "17 */2 * * *"   # a cada 2 horas

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Buscar
        env:
          # O comando vem do app; passa por variável de ambiente (nunca direto no shell)
          # e é validado pelo coletor.
          COMMAND: ${{ github.event.inputs.command }}
        run: python -m collector --command-env COMMAND
      - name: Salvar resultados
        run: |
          git config user.name "milhas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/results.json data/state.json data/monitors.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza resgates"
            git pull --rebase origin main
            git push
          fi
